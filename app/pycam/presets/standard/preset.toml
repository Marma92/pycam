# Le rendu par défaut de l'appareil : la courbe de tons du tuning standard du Pi
# (imx477.json), sans son contraste adaptatif, appliquée à la base pycam.
# Calculée le 2026-10-11 : base Rec.709 -> lumière linéaire -> courbe standard.
format = 1
base = "pycam-1"
name = "Standard"
short = "STD"
description = "Le rendu habituel du Pi : tons moyens clairs, hautes lumières adoucies."

[look]
tone_curve = [
    [0.0, 0.0], [0.02, 0.022], [0.05, 0.055], [0.1, 0.109], [0.15, 0.163], [0.2, 0.218],
    [0.3, 0.35], [0.4, 0.497], [0.5, 0.638], [0.6, 0.752], [0.7, 0.835], [0.8, 0.901],
    [0.9, 0.951], [1.0, 1.0],
]
