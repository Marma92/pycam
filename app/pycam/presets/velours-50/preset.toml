# Inspiré de l'inversible couleur Fujifilm Velvia 50 (docs/presets.md §6).
# Première version (méthode A), réglée sur les scans d'un ami photographe, avec son accord (3), mesurés le
# 2026-10-12 : ciels bleu profond (~219°), verts et jaunes saturés ; complétée par le
# caractère connu de la Velvia : contraste fort, noirs denses, peu de latitude, une
# exposition un peu serrée (-1/3) pour la densité des couleurs.
format = 1
base = "pycam-1"
name = "Velours 50"
short = "V50"
description = "Diapositive : couleurs denses, ciels profonds, verts vifs, contraste fort."

[shooting]
exposure_bias = -0.3

[look]
tone_curve = [
    [0.0, 0.02], [0.1, 0.07], [0.25, 0.21], [0.5, 0.52], [0.75, 0.81],
    [0.9, 0.93], [1.0, 0.98],
]
saturation = 1.12
split_toning = { shadows = [300, 0.03], highlights = [45, 0.02] }

[look.colours]  # [teinte en degrés, saturation, luminosité]
red = [0, 1.1, 0.0]
orange = [0, 1.05, 0.0]
yellow = [0, 1.1, 0.0]
green = [-4, 1.15, -0.04]
aqua = [5, 1.1, -0.04]
blue = [6, 1.12, -0.08]
purple = [0, 1.1, -0.04]
magenta = [0, 1.05, 0.0]

[grain]
amount = 0.06
size = 1.0
